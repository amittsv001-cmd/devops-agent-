<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI DevOps Master Agent</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0d1117; color: #c9d1d9; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; }
        header { background: #161b22; padding: 15px 20px; text-align: center; border-bottom: 1px solid #30363d; font-size: 1.2rem; font-weight: bold; color: #58a6ff; }
        #chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; max-width: 900px; width: 100%; margin: 0 auto; box-sizing: border-box; }
        .message { padding: 12px 16px; border-radius: 8px; max-width: 80%; line-height: 1.5; word-wrap: break-word; font-size: 0.95rem; }
        .user-message { background: #238636; color: #fff; align-self: flex-end; }
        .bot-message { background: #21262d; border: 1px solid #30363d; color: #c9d1d9; align-self: flex-start; white-space: pre-wrap; font-family: monospace; }
        #input-container { padding: 15px; background: #161b22; border-top: 1px solid #30363d; display: flex; max-width: 900px; width: 100%; margin: 0 auto; gap: 10px; box-sizing: border-box; }
        input { flex: 1; padding: 12px; border-radius: 6px; border: 1px solid #30363d; background: #0d1117; color: #fff; outline: none; font-size: 1rem; }
        input:focus { border-color: #58a6ff; }
        button { padding: 12px 22px; background: #238636; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 1rem; }
        button:hover { background: #2ea043; }
        .loading { font-style: italic; color: #8b949e; font-family: sans-serif !important; }
    </style>
</head>
<body>
    <header>🤖 AI DevOps Master Agent (MCP + LangGraph + Gemini)</header>
    
    <div id="chat-container">
        <div class="message bot-message">Hello! I am your AI DevOps Master Agent. How can I assist you with your workspace or tasks today?</div>
    </div>

    <div id="input-container">
        <input type="text" id="user-input" placeholder="Type your question or DevOps task here..." onkeypress="checkEnter(event)">
        <button onclick="sendMessage()">Send</button>
    </div>

    <script>
        async function sendMessage() {
            const inputField = document.getElementById("user-input");
            const chatContainer = document.getElementById("chat-container");
            const promptText = inputField.value.trim();
            if (!promptText) return;

            // Append User Message
            chatContainer.innerHTML += `<div class="message user-message">${escapeHtml(promptText)}</div>`;
            inputField.value = "";
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // Append Loading Indicator
            const loadingId = "loading-" + Date.now();
            chatContainer.innerHTML += `<div id="${loadingId}" class="message bot-message loading">⚙️ Agent is processing your request...</div>`;
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                const res = await fetch("http://127.0.0.1:8000/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ prompt: promptText })
                });
                
                const data = await res.json();
                document.getElementById(loadingId).remove();
                
                if (res.ok) {
                    chatContainer.innerHTML += `<div class="message bot-message">${escapeHtml(data.response || "No response generated.")}</div>`;
                } else {
                    chatContainer.innerHTML += `<div class="message bot-message" style="color: #f85149;">❌ Server Error: ${escapeHtml(data.detail || JSON.stringify(data))}</div>`;
                }
            } catch (err) {
                document.getElementById(loadingId).remove();
                chatContainer.innerHTML += `<div class="message bot-message" style="color: #f85149;">❌ Connection Error: Could not reach FastAPI backend.</div>`;
            }
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function checkEnter(e) {
            if (e.key === "Enter") sendMessage();
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
